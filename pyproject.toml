[project]
name = "chinese-autoconvert"
version = "2.0.0"
description = "簡轉繁批次轉檔 CLI：自動偵測編碼、簡體轉繁體（台灣用語）並輸出 UTF-8"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "charset-normalizer>=3.5.2",
    "opencc-python-reimplemented>=0.1.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
